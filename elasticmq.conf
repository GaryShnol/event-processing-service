include classpath("application.conf")

# "*" makes queue URLs use the host the client called, so they work from the
# host, from other containers and through Testcontainers' mapped port.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  events-queue {
    defaultVisibilityTimeout = 90 seconds
    deadLettersQueue {
      name = "events-dlq"
      maxReceiveCount = 5
    }
  }
  events-dlq {}
}

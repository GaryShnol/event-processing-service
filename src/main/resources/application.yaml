server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: event-processing-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/events}
  cloud:
    aws:
      sqs:
        listener:
          # false for an API-only deployment: events are still published, but this instance doesn't consume them.
          auto-startup: ${SQS_LISTENER_ENABLED:true}

events:
  queues:
    events: ${EVENTS_QUEUE:events-queue}
  # Bounds one publish; on timeout the event stays stored and the sweeper publishes it later.
  publish-timeout: ${PUBLISH_TIMEOUT:3s}
  lease: ${PROCESSING_LEASE:60s}
  max-attempts: ${PROCESSING_MAX_ATTEMPTS:3}
  max-amount: ${MAX_AMOUNT:10000.00}
  sweeper:
    # false turns the recovery sweeper off on this instance.
    enabled: ${SWEEPER_ENABLED:true}
    interval: ${SWEEPER_INTERVAL:30s}
    republish-after: ${SWEEPER_REPUBLISH_AFTER:2m}
    batch-size: ${SWEEPER_BATCH_SIZE:100}
  paging:
    default-size: ${PAGE_DEFAULT_SIZE:20}
    max-size: ${PAGE_MAX_SIZE:100}
    # page * size; deeper offsets walk that many index keys per request.
    max-offset: ${PAGE_MAX_OFFSET:10000}
  metadata:
    max-entries: ${METADATA_MAX_ENTRIES:20}
    max-key-length: ${METADATA_MAX_KEY_LENGTH:64}
    max-value-length: ${METADATA_MAX_VALUE_LENGTH:256}
  mongo:
    # How long a request waits for an unreachable MongoDB, and for any single operation (a MongoDB that
    # accepts the connection but stops answering). Both end in a 503. Applied in code, whatever MONGODB_URI says.
    server-selection-timeout: ${MONGO_SERVER_SELECTION_TIMEOUT:5s}
    operation-timeout: ${MONGO_OPERATION_TIMEOUT:10s}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

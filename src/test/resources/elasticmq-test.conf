# The production queues unchanged, plus a fast pair so redelivery and dead-letter tests take seconds.
# fast-events-queue keeps the startup check's rules with events.lease=1s and maxAttempts 3.
include file("/opt/elasticmq-production.conf")

queues {
  fast-events-queue {
    defaultVisibilityTimeout = 2 seconds
    deadLettersQueue {
      name = "fast-events-dlq"
      maxReceiveCount = 5
    }
  }
  fast-events-dlq {}
}

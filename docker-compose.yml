services:
  mongo:
    image: mongo:8.0.38
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    # These take precedence over .env: container hostnames, and the port the mapping and health check use.
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/events
      SQS_ENDPOINT: http://elasticmq:9324
    depends_on:
      mongo:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
